# ELIGO - Data dictionary v0.3 (DRAFT, to be signed by both poles = gate G1)
# Single source of truth: Django forms/model choices AND the ai/ matching engine
# read this file. If code and dictionary differ, the code is wrong.
#
# Changelog v0.1 -> v0.2 (after testing on Mitacs, DAAD, Eiffel, Erasmus Mundus, Chevening)
#  1. enrollment_mode
#  2. institution_type, institution_country
#  3. class_rank_percentile
#  4. previous_awards
#  5. target_degree_level
#  6. first_degree_date, highest_degree_date (+ computed years_since_* fields)
#  7. computed highest_degree_at_start (removes the need for OR logic)
#  8. work_experience_hours_post_degree
#  9. field_of_study merged: computer science now sits inside engineering_technology; subfield added
#
# Changelog v0.2 -> v0.3 (after testing on DAAD, Campus France Eiffel, Stipendium Hungaricum, Mitacs GRI, IAESTE Tunisia)
#  10. [BREAKING] nationality -> nationalities (list). Eiffel excludes French dual nationals, SH excludes Hungarian ones.
#  11. months_resident_in_germany (DAAD: not more than 15 months at the deadline)
#  12. phd_start_date + computed years_since_phd_start_at_deadline (DAAD doctoral: started at most 3 years ago)
#  13. post_bac_years_completed (IAESTE Tunisia: 3 years of post-baccalaureate study)
#  14. supervisor_status (DAAD doctoral, SH PhD, Eiffel PhD) and pfe_agreement (Mitacs GRI Tunisia)
#  15. work_study_contract (Eiffel: apprenticeship / work-study status is incompatible)
#  16. previous_awards: new values; new rejected_applications list (Eiffel: a rejected candidate cannot re-apply)
#  17. field_of_study: architecture_design added (IAESTE: engineering or architecture)
#  18. [BREAKING] target_degree_level and degree_level_offered: research_internship -> internship (GRI and IAESTE)
#  19. LanguageSkill: computed certificate_age_years_at_deadline (DAAD: proof not older than 3 years)
#  20. computed meets_iaeste_level (IAESTE level rule is "A or B", so it becomes a computed field)
#  21. Two-level structure: funding_scheme_record added; program_record points to it (scheme_slug, track);
#      criterion_record gets scope (scheme | program) and strength (hard | as_a_rule | soft) in place of
#      mandatory [BREAKING for any code reading `mandatory`]; variants (e.g. Eiffel PhD 36 vs 12/18 months)
#      are separate program records, so there is no applies_if.
#  22. Not modelled, on purpose: availability windows and research-security affiliations (MITACS) become
#      program declarations; the German 1-5 scale (Zuse Schools benchmark 1.7) stays unsupported, so that
#      criterion is to_verify; SH exam threshold and IAESTE ranking score are not profile-based.
#  Additive changes (new optional fields or enum values): 11, 12, 13, 14, 15, 16, 17, 19, 20.
#
# Conventions
#  - Stored values are slugs; labels are for display only.
#  - null = unknown -> the engine reports a "missing" criterion, never a failure.
#  - matching: true  -> the engine may use the field in a criterion.
#  - matching: false -> used only for ranking / CV / letter generation.
#  - computed: true  -> derived by the engine, never entered by the student.
#  - Criteria are combined with AND only (v0). Any "A or B" rule must be turned into a computed field.

meta:
  version: "0.3"
  status: draft
  owners: [Zaineb Hattab, Shaima Hechmi]
  note: >
    Dual nationality is handled from v0.3 through the nationalities list
    (contains / not_contains), as foreseen in v0.2.

operators:
  - eq
  - neq
  - in
  - not_in
  - gte
  - lte
  - between        # inclusive [min, max]
  - contains       # list field contains a value
  - not_contains
  # gte / lte / between also apply to date fields (value = ISO date or [min, max] dates).

scales:
  degree_level:
    secondary:         {rank: 0, label: "Secondary (baccalaureate level)"}
    bachelor:          {rank: 1, label: "Bachelor (licence)"}
    engineering_cycle: {rank: 2, label: "Engineering cycle (cycle ingenieur)"}
    master:            {rank: 2, label: "Master"}
    phd:               {rank: 3, label: "PhD"}
  cefr:
    A1: {rank: 1}
    A2: {rank: 2}
    B1: {rank: 3}
    B2: {rank: 4}
    C1: {rank: 5}
    C2: {rank: 6}
    native: {rank: 7}

fields:
  # ---------- Identity and origin ----------
  date_of_birth:
    type: date
    matching: true
    required: true

  nationalities:                         # change 10 (replaces `nationality`)
    type: list_of_choice
    matching: true
    required: true
    default: [TN]
    values: [TN, FR, HU, other]
    form: visible
    help: "All nationalities held. Needed for programs that exclude French or Hungarian dual nationals."

  country_of_residence:
    type: choice
    matching: true
    required: true
    default: TN
    values: [TN, FR, DE, CA, IT, other]
    form: visible

  months_resident_in_germany:            # change 11
    type: integer
    min: 0
    matching: true
    required: false
    help: "Months lived in Germany at the application date. 0 if never."

  # ---------- Current studies ----------
  current_level:
    type: ranked_choice
    scale: degree_level
    allow_none: true
    matching: true
    required: true
    help: "What the student is enrolled in now."

  year_of_study:
    type: integer
    min: 1
    max: 6
    matching: true
    required: false

  post_bac_years_completed:              # change 13
    type: integer
    min: 0
    max: 10
    matching: true
    required: false
    help: "Years of post-baccalaureate study already completed (all programs, counting preparatory years)."

  expected_graduation:
    type: date
    matching: true
    required: false

  enrollment_mode:                       # change 1
    type: choice
    values: [full_time, part_time]
    matching: true
    required: true

  institution_type:                      # change 2
    type: choice
    values: [public, private]
    matching: true
    required: true

  institution_country:                   # change 2
    type: choice                         # ISO 3166-1 alpha-2
    default: TN
    matching: true
    required: true

  class_rank_percentile:                 # change 3
    type: decimal
    min: 0
    max: 100
    matching: true
    required: false
    help: "Self-declared: 'top X%' of the class (20 = top 20%). Unverified, to be proven with a document."

  field_of_study:                        # change 9
    type: choice
    matching: true
    required: true
    values:
      - engineering_technology           # includes computer science, data, AI
      - mathematics_statistics
      - natural_sciences
      - business_economics
      - health_medicine
      - law_social_sciences
      - humanities_arts
      - architecture_design              # change 17
      - other
    note: "List to be extended once the 15 programs are chosen."

  subfield:                              # change 9
    type: choice
    matching: true
    required: false
    values:
      - computer_science
      - data_science_ai
      - electrical_electronics
      - mechanical_industrial
      - civil_environmental
      - other_engineering
      - not_applicable
    help: "Only for programs restricted to a sub-field."

  specialization:
    type: text
    matching: false
    required: false

  # ---------- Degrees already obtained ----------
  highest_degree:
    type: ranked_choice
    scale: degree_level
    matching: true
    required: true
    help: "Highest degree already completed (e.g. licence while enrolled in the engineering cycle)."

  first_degree_date:                     # change 6
    type: date
    matching: true
    required: false
    help: "Date the first (undergraduate) degree was completed. Null if not yet obtained."

  highest_degree_date:                   # change 6
    type: date
    matching: true
    required: false
    help: "Date the highest completed degree was obtained."

  phd_start_date:                        # change 12
    type: date
    matching: true
    required: false
    help: "Only if currently enrolled in a PhD: date the doctorate started."

  # ---------- Marks ----------
  gpa_value:
    type: decimal
    matching: false
    required: false

  gpa_scale:
    type: choice
    values: ["20", "4.0", "100"]
    matching: false
    required: false
    note: "German 1-5 scale (1 = best) is NOT supported in v0."

  gpa_percent:
    type: decimal
    computed: true
    matching: true
    formula: "gpa_value / gpa_scale * 100"
    note: >
      Linear conversion = v0 simplification. A 15/20 and a 3.0/4.0 are not
      equivalent in practice: validate against the wording of each program.

  # ---------- Experience ----------
  work_experience_months:
    type: integer
    min: 0
    matching: true
    required: false

  work_experience_hours_post_degree:     # change 8
    type: integer
    min: 0
    matching: true
    required: false
    help: "Hours of work experience gained AFTER completing the first degree (Chevening counts 2,800 h)."

  # ---------- Awards ----------
  previous_awards:                       # change 4
    type: list_of_choice
    matching: true
    required: false
    values:                              # program slugs + generic buckets; grows with the catalogue
      - mitacs_globalink
      - daad_study_scholarship
      - eiffel_master
      - erasmus_mundus_jm
      - chevening
      - other_uk_government_scholarship
      - french_government_scholarship
      - eiffel_phd                       # change 16
      - daad_doctoral
      - zuse_school_scholarship
      - stipendium_hungaricum_bachelor
      - stipendium_hungaricum_master
      - stipendium_hungaricum_phd
      - hungarian_government_scholarship
    help: "Awards already received or currently held."

  rejected_applications:                 # change 16
    type: list_of_choice
    matching: true
    required: false
    values: [eiffel_master, eiffel_phd]
    help: "Selections already lost. Eiffel does not accept a candidate rejected before, even via another institution."

  # ---------- Application readiness ----------
  work_study_contract:                   # change 15
    type: boolean
    matching: true
    required: false
    help: "Currently under an apprenticeship or work-study contract."

  supervisor_status:                     # change 14
    type: choice
    values: [none, contacted, confirmed]
    matching: true
    required: false
    help: "Doctoral applicants: none = no supervisor yet; confirmed = written confirmation or acceptance statement obtained."

  pfe_agreement:                         # change 14
    type: boolean
    matching: true
    required: false
    help: "Signed agreement with the supervisor to carry out the end-of-studies project during the internship (Mitacs GRI Tunisia)."

  # ---------- Target ----------
  target_degree_level:                   # change 5
    type: choice
    values: [master, phd, internship]    # change 18 (was research_internship)
    matching: true
    required: true
    note: >
      Implicit filter: the engine only matches programs whose degree_level_offered
      equals this value. It is not repeated as a criterion in every program.

  # ---------- Languages ----------
  languages:
    type: list
    item: LanguageSkill
    matching: true
    criterion_path: "language:<code>"

# ---------- Computed fields (program-dependent), change 6 and 7 ----------
computed:
  age_at_deadline:
    type: integer
    formula: "full years between date_of_birth and program.deadline"
  years_since_first_degree_at_deadline:
    type: decimal
    formula: "years between first_degree_date and program.deadline (0 if not yet obtained, null if unknown)"
  years_since_highest_degree_at_deadline:
    type: decimal
    formula: "years between highest_degree_date and program.deadline (0 if not yet obtained, null if unknown)"
  years_since_phd_start_at_deadline:     # change 12
    type: decimal
    formula: "years between phd_start_date and program.deadline (null if not enrolled in a PhD or unknown)"
  meets_iaeste_level:                    # change 20 - program-specific predicate (IAESTE Tunisia)
    type: boolean
    formula: >
      (field_of_study in [engineering_technology, architecture_design] and post_bac_years_completed >= 3)
      or (current_level in [master, phd] and field_of_study in
      [engineering_technology, mathematics_statistics, natural_sciences])
  highest_degree_at_start:               # change 7
    type: ranked_choice
    scale: degree_level
    formula: >
      current_level if (expected_graduation <= program.start_date and
      rank(current_level) > rank(highest_degree)) else highest_degree.
      A final-year student therefore counts as holding the degree if they
      graduate before the program starts.

LanguageSkill:
  language:
    type: choice
    values: [ar, fr, en, de, es, it, other]
  cefr_level:
    type: ranked_choice
    scale: cefr
  certificate_type:
    type: choice
    required: false
    values: [ielts, toefl, toeic, delf, dalf, tcf, tef, goethe, testdaf, other]
  certificate_score:
    type: decimal
    required: false
    criterion_path: "language:<code>.certificate_score"
  certificate_date:
    type: date
    required: false
  certificate_age_years_at_deadline:     # change 19
    type: decimal
    computed: true
    formula: "years between certificate_date and program.deadline (null if no certificate date)"
    criterion_path: "language:<code>.certificate_age_years_at_deadline"

generation_only:
  interests:
    type: list_of_text
    matching: false
  target_countries:
    type: list_of_choice
    matching: false
  target_opportunity_types:
    type: list_of_choice
    values: [scholarship, internship, fellowship]
    matching: false
  education_entries:
    type: list
    matching: false
  consent_ai_processing:
    type: boolean
    required: true
    matching: false

# ---------- Program-side record (NOT part of the student profile) ----------
# These are shown with the result; they are not eligibility criteria.
program_record:
  slug: text
  name: text
  operator: text
  scheme_slug: text                 # change 21: points to funding_scheme_record
  track: [master, phd, internship]
  degree_level_offered: [master, phd, internship]
  application_route: [direct, via_institution, via_home_university, via_consortium, via_sending_partner, via_national_committee]
  cohort: text
  status: [open, closed, upcoming, unknown]
  deadline: date          # per cohort; used by age_at_deadline and years_since_*
  start_date: date        # used by highest_degree_at_start
  source_url: url
  date_checked: date
  declarations: list_of_text        # e.g. return commitment
  required_documents: list_of_text

# ---------- Scheme-side record (change 21) ----------
funding_scheme_record:
  slug: text                        # e.g. daad, campus_france_eiffel, stipendium_hungaricum, mitacs_gri, iaeste_tunisia
  name: text
  operator: text
  type: [scholarship, internship]
  tracks: list_of_choice            # subset of [master, phd, internship]
  source_url: url
  date_checked: date

criterion_record:
  scope: [scheme, program]          # change 21: scheme criteria are inherited by every program of the scheme and track
  scheme_slug: text
  track: [master, phd, internship]
  program_slug: "text, only when scope = program"
  field: "profile field, computed field or language:<code>"
  operator: "one of operators"
  value: "scalar, list or [min, max]"
  strength: [hard, as_a_rule, soft] # change 21 (replaces `mandatory`): hard fails -> not_eligible; as_a_rule fails -> partially_eligible with a reason; soft -> score only
  to_verify: boolean
  source_note: text