<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand text-primary" href="{% url 'home' %}">ELIGO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        </li>
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'profile_edit' %}active{% endif %}" href="{% url 'profile_edit' %}">Profile</a></li>
          <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Matches</a></li>
          <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Applications</a></li>
          <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Assistant</a></li>
        {% endif %}
      </ul>

      <ul class="navbar-nav ms-auto align-items-lg-center">
        {% if user.is_authenticated %}
          <li class="nav-item"><span class="navbar-text me-lg-3">{{ user.email }}</span></li>
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="btn btn-outline-secondary btn-sm">Log out</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}" href="{% url 'login' %}">Log in</a></li>
          <li class="nav-item"><a class="btn btn-primary btn-sm ms-lg-2" href="{% url 'register' %}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
