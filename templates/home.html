{% extends "base.html" %}
{% block content %}
<h1>ELIGO</h1>
{% if user.is_authenticated %}
  <p>Logged in as {{ user.email }}</p>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button class="btn btn-outline-secondary">Log out</button>
  </form>
{% else %}
  <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
  <a class="btn btn-outline-primary" href="{% url 'register' %}">Register</a>
{% endif %}
{% endblock %}
