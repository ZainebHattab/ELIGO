{% extends "base.html" %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h1 class="h3 mb-3">Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn btn-primary mt-3">Log in</button>
  </form>
  <p class="mt-3">
    <a href="{% url 'password_reset' %}">Forgot your password?</a><br>
    No account yet? <a href="{% url 'register' %}">Register</a>
  </p>
</div>
{% endblock %}
